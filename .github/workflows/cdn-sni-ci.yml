name: cdn-sni-feature-check

concurrency:
  group: cdn-sni-feature-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [feature/cdn-sni-engine]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/cdn-sni-ci.yml'
  pull_request:
    branches: [config-finder-liquid-integration]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/cdn-sni-ci.yml'

permissions:
  contents: read

jobs:
  android-and-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch native engine artifacts
        run: ./tools/get-cores.sh android
      - name: Compile Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Compile shared code and run tests
        run: ./gradlew --no-daemon :shared:desktopTest
